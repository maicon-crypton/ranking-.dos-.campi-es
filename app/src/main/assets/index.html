<!-- ============================================================================

   Contém HTML, CSS (estilo customizado) e JavaScript (lógica da aplicação).
   ============================================================================ -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ranking dos Campeões — Campeão da Construção (Brasília-DF)</title>
  <link href="tailwind.css" rel="stylesheet" />

  <style>
    /* ============================================================================
       CSS CUSTOMIZADO — Estilos visuais do app
       - Fontes: Inter e Plus Jakarta Sans
       - Componentes: cards, pódio, botões, telefone, scan laser, ranking, login
       ============================================================================ */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('./fonts/inter-latin.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url('./fonts/plus-jakarta-sans-latin.woff2') format('woff2');
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F7F8FA;
      color: #111827;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hairline-card {
      background: #FFFFFF;
      border: 1px solid #E6E8EC;
      box-shadow: 0 2px 10px -4px rgba(17, 24, 39, 0.04);
    }

    .podio-gold {
      background: linear-gradient(180deg, #FFFDF7 0%, #FFFBEB 100%);
      border: 1px solid #FDE68A;
      box-shadow: 0 4px 14px -6px rgba(180, 83, 9, 0.14);
    }

    .podio-silver {
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
      border: 1px solid #CBD5E1;
      box-shadow: 0 4px 14px -6px rgba(71, 85, 105, 0.12);
    }

    .podio-bronze {
      background: linear-gradient(180deg, #FFFDFB 0%, #FFF7ED 100%);
      border: 1px solid #FED7AA;
      box-shadow: 0 4px 14px -6px rgba(194, 65, 12, 0.10);
    }

    .btn-primary {
      background: #166534;
      color: #FFFFFF;
      border: 1px solid #14532D;
      transition: background-color 150ms ease, transform 120ms ease, box-shadow 150ms ease;
      box-shadow: 0 2px 6px rgba(22, 101, 52, 0.18);
    }
    .btn-primary:hover {
      background: #15803D;
    }
    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-ghost {
      background: #FFFFFF;
      color: #374151;
      border: 1px solid #E6E8EC;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .btn-ghost:hover {
      background: #F9FAFB;
      border-color: #D1D5DB;
    }

    .phone-shell {
      background: #18181B;
      border: 3px solid #27272A;
      box-shadow: 0 24px 54px -16px rgba(17, 24, 39, 0.18);
    }

    .phone-viewport {
      background: #F7F8FA;
      scrollbar-width: thin;
      scrollbar-color: #E5E7EB transparent;
    }
    .phone-viewport::-webkit-scrollbar {
      width: 4px;
    }
    .phone-viewport::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 9999px;
    }

    @keyframes scanLine {
      0%, 100% { transform: translateY(8px); opacity: 0.35; }
      50% { transform: translateY(108px); opacity: 0.95; }
    }
    .scan-laser {
      animation: scanLine 2.6s ease-in-out infinite;
    }

    .thin-track {
      height: 6px;
      background: #EEF0F4;
      border-radius: 9999px;
      overflow: hidden;
    }
    .thin-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes rankingEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ranking-enter {
      animation: rankingEnter 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--ranking-index, 0) * 45ms);
    }

    @media (prefers-reduced-motion: reduce) {
      .ranking-enter {
        animation: none;
      }
    }

    .login-brand-panel {
      background:
        radial-gradient(circle at 82% 12%, rgba(202, 138, 4, 0.16), transparent 28%),
        linear-gradient(155deg, #07170f 0%, #0b2b1b 58%, #123a24 100%);
      border-bottom: 1px solid rgba(250, 204, 21, 0.12);
    }

    .login-brand-logo {
      filter: none;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 18px 48px -24px rgba(6, 20, 12, 0.55),
        0 2px 10px rgba(6, 20, 12, 0.08);
    }

    .login-input {
      height: 58px;
      padding-top: 16px;
      padding-bottom: 8px;
      border-radius: 16px;
      background: rgba(247, 248, 250, 0.72);
      transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }

    .login-input-with-right-icon {
      padding-right: 3.5rem;
    }

    .login-input-with-right-action {
      padding-right: 3.75rem;
    }

    .login-remember-hint {
      display: block;
      margin-top: 0.2rem;
      color: #64736B;
      font-size: 0.6875rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .login-user-icon {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0.5rem;
      transform: translateY(-50%);
      border: 1px solid rgba(22, 101, 52, 0.12);
      border-radius: 0.75rem;
      background: #F0FDF4;
      color: #166534;
      pointer-events: none;
    }

    .login-input:focus {
      border-color: #166534;
      outline: none;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.10);
    }

    .login-input:focus + .login-label,
    .login-input:not(:placeholder-shown) + .login-label {
      transform: translateY(-1.4rem) scale(0.75);
      color: #166534;
    }

    .login-label {
      pointer-events: none;
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      transition: all 150ms ease;
    }

    .login-role-btn {
      transition: all 150ms ease;
    }

    .login-role-btn.active {
      background: linear-gradient(135deg, #166534, #15803D);
      color: white;
    }

    .login-btn-primary {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #172012;
      box-shadow:
        0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: all 150ms ease;
    }

    .login-btn-primary:hover {
      filter: brightness(1.05);
    }

    .login-btn-primary:active {
      transform: translateY(0);
    }

    .login-btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-show-pass {
      position: absolute;
      top: 50%;
      right: 0.625rem;
      display: flex;
      width: 2.5rem;
      height: 2.5rem;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 1px solid #E6E8EC;
      border-radius: 0.75rem;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(17, 24, 39, 0.08);
      color: #6B7280;
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .login-show-pass:hover {
      border-color: #BBF7D0;
      color: #166534;
      background: #F0FDF4;
    }

    .login-show-pass:active {
      transform: translateY(-50%) scale(0.96);
    }

    .login-show-pass:focus-visible {
      outline: 3px solid rgba(22, 101, 52, 0.2);
      outline-offset: 2px;
    }

    .login-anim { animation: none; }

    .login-bg-pattern { background-size: 24px 24px; }

    /* Login utility classes */
    .login-bg-pattern { background-size: 24px 24px; }

    body.android-app {

<body class="min-h-screen flex flex-col">

  <!-- Barra Superior Minimalista -->
  <header class="w-full bg-white/90 backdrop-blur border-b border-campeao-line sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-campeao-greenSoft border border-campeao-green/20 flex items-center justify-center text-campeao-greenDark shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
        </div>
        <div class="truncate">
          <span class="font-semibold text-sm text-campeao-ink">Ranking dos Campeões</span>
          <span class="hidden sm:inline text-xs text-campeao-muted ml-2">Campeão da Construção • Brasília-DF</span>
        </div>
      </div>

      <!-- Seletor de Telas (Desktop) -->
      <nav aria-label="Telas do aplicativo" class="hidden md:flex items-center gap-1 bg-campeao-surface p-1 rounded-xl border border-campeao-line">
        <button data-screen-tab="login" onclick="selectScreen('login')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
        <button data-screen-tab="ranking" onclick="selectScreen('ranking')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
        <button data-screen-tab="scanner" onclick="selectScreen('scanner')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
        <button data-screen-tab="equipe" onclick="selectScreen('equipe')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
        <button data-screen-tab="relatorios" onclick="selectScreen('relatorios')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
        <button data-screen-tab="configuracoes" onclick="selectScreen('configuracoes')" class="screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer"></button>
      </nav>

      <!-- Modo de Visualização & Perfil ADM/Operador -->
      <div class="flex items-center gap-2">
        <div class="flex items-center bg-campeao-surface p-0.5 rounded-xl border border-campeao-line">
          <button
            id="roleAdmBtn"
            onclick="setUserRole('adm')"
            class="px-2.5 py-1 rounded-lg text-xs font-medium bg-campeao-greenDark text-white transition cursor-pointer"
          >
            ADM
          </button>
          <button
            id="roleOpBtn"
            onclick="setUserRole('operador')"
            class="px-2.5 py-1 rounded-lg text-xs font-medium text-campeao-muted hover:text-campeao-ink transition cursor-pointer"
          >
            Operador
          </button>
        </div>

        <div class="hidden sm:flex items-center bg-campeao-surface p-0.5 rounded-xl border border-campeao-line">
          <button
            id="modeSingleBtn"
            onclick="setViewMode('single')"
            class="px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-campeao-ink shadow-2xs transition cursor-pointer"
          >
            Foco
          </button>
          <button
            id="modeSideBtn"
            onclick="setViewMode('side')"
            class="px-2.5 py-1 rounded-lg text-xs font-medium text-campeao-muted hover:text-campeao-ink transition cursor-pointer"
          >
            Lado a Lado
          </button>
        </div>
      </div>
    </div>

    <!-- Seletor de Telas (Mobile) -->

      <button data-screen-tab="login" onclick="selectScreen('login')" class="screen-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium border transition cursor-pointer"></button>

  <!-- Toast Discreto -->
  <div id="toastBanner" class="fixed bottom-5 right-5 z-50 hidden max-w-xs">
    <div id="toastInner" class="rounded-2xl px-4 py-2.5 text-white font-medium text-xs shadow-lg flex items-center gap-2 bg-campeao-ink">

      <span id="toastText">Atualizado.</span>

  <!-- Área Central -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col items-center justify-center">
    <div id="showcaseContainer" class="w-full flex flex-col items-center justify-center"></div>
  </main>

    // ---------------------------------------------------------------------------
    // Inicialização nativa — carrega os dados pela ponte Android.
    // O resultado é processado em applyNativeBootstrapResult().
    // ---------------------------------------------------------------------------
    function applyNativeBootstrap() {
      if (!IS_ANDROID_APP || !window.AndroidApp) return;
      try {
        window.AndroidApp.bootstrap();
      } catch (error) {
        console.error('Não foi possível carregar os dados do aplicativo.', error);
        nativeBootstrapReady = true;
        loginError = 'Não foi possível carregar os dados. Feche e abra o aplicativo novamente.';
        renderApp();
      }
    }

    window.applyNativeBootstrapResult = function (resultJson) {
      nativeBootstrapReady = true;
      try {
        const data = JSON.parse(resultJson);
        if (data.error) throw new Error(data.error);
        if (Array.isArray(data.employees)) {
          appState.employees = data.employees;
        }
        if (Array.isArray(data.notes)) {
          appState.notes = data.notes;
        }
        if (Array.isArray(data.observations)) {
          appState.observations = data.observations;
        }
        if (Array.isArray(data.adminUsers)) {
          appState.adminUsers = data.adminUsers;
        }
        if (IS_ANDROID_APP && typeof window.AndroidApp.getAutoApproveNotes === 'function') {
          try {
            const autoApprove = JSON.parse(window.AndroidApp.getAutoApproveNotes());
            appState.autoApproveNotes = autoApprove.enabled === true;
          } catch (error) {
            appState.autoApproveNotes = false;
          }
        }
        if (data.auditStatus && typeof data.auditStatus === 'object') {
          appState.admAuditStatus = data.auditStatus;
        }
        if (data.authenticated) {
          appState.userRole = data.role === 'ADMIN' ? 'adm' : 'operador';
          if (appState.userRole === 'operador') {
            const ownEmployee = appState.employees.find((employee) =>
              String(employee.matricula || '').toLowerCase() === String(appState.loginId || '').toLowerCase()
            );
            if (ownEmployee) appState.scanEmployeeId = String(ownEmployee.id);
          }
          if (appState.activeScreen === 'login') {
            appState.activeScreen = appState.userRole === 'adm' ? 'relatorios' : 'ranking';
          }
        } else {
          if (typeof data.rememberedUsername === 'string') {
            appState.loginId = data.rememberedUsername;
          }
          if (typeof data.rememberedPassword === 'string' && data.rememberCredentials) {
            appState.loginPin = data.rememberedPassword;
          }
          appState.rememberCredentials = data.rememberCredentials === true;
          appState.userRole = 'operador';
          appState.activeScreen = 'login';
        }
      } catch (error) {
        console.error('Não foi possível carregar os dados do aplicativo.', error);
        loginError = 'Não foi possível carregar os dados. Feche e abra o aplicativo novamente.';
      }
      renderApp();
    };

    // ---------------------------------------------------------------------------
    // Recebe o resultado da análise OCR da nota enviado pela ponte Android.
    // ---------------------------------------------------------------------------
    window.onScanAnalysisResult = function (requestId, resultJson) {
      let result;
      try {
        result = JSON.parse(resultJson);
      } catch (error) {
        console.error('Resposta inválida da análise da nota.', error);
        result = { success: false, message: 'A resposta da análise veio em formato inválido.' };
      }

      if (requestId === appState.scanConfirmRequestId) {
        appState.scanConfirmRequestId = '';
        if (result.success) {
          clearScanAnalysisPreview();
          appState.scanPhotoSource = '';
          appState.scanPhotoName = '';
          appState.scanObservation = '';
          selectedPhotoFile = null;
          applyNativeBootstrap();
          appState.activeScreen = 'equipe';
          appState.equipeTab = 'notas';
          appState.noteStatusFilter = 'queue';
          showToast(result.message || 'Nota enviada para auditoria.');
        } else {
          showToast(result.message || 'Não foi possível enviar a nota.');
        }
        renderApp();
        return;
      }

      if (requestId !== appState.scanAnalysisRequestId) {
        if (result.success && result.token && window.AndroidApp) {
          window.AndroidApp.cancelScanAnalysis(result.token);
        }
        return;
      }

      appState.scanAnalysisRequestId = '';
      appState.scanAnalysisLoading = false;
      if (result.success) {
        appState.scanAnalysis = result;
        appState.scanAnalysisError = '';
      } else {
        appState.scanAnalysis = null;
        appState.scanAnalysisError = result.message || 'Não foi possível analisar a nota.';
      }
      renderApp();
    };

    window.onLoginResult = function (resultJson) {

      let result;
      try {

        console.error('Resposta inválida do login.', error);
        loginError = 'Não foi possível autenticar. Tente novamente.';
        renderApp();
        return;
      }
      if (!result.success) {
        loginError = result.message || 'Matrícula ou senha inválida.';
        renderApp();
        return;
      }
      appState.userRole = result.role === 'ADMIN' ? 'adm' : 'operador';
      try {
        const saveResult = JSON.parse(window.AndroidApp.rememberUsername(appState.loginId.trim()));
        if (!saveResult.success) {
          console.warn('Não foi possível salvar a matrícula.', saveResult.message);
        }
        if (typeof window.AndroidApp.saveCredentials === 'function') {
          window.AndroidApp.saveCredentials(
            appState.loginId.trim(),
            appState.loginPin,
            appState.rememberCredentials
          );
        }
      } catch (error) {
        console.error('Não foi possível salvar a matrícula.', error);
      }

      appState.loginPin = '';
      appState.viewMode = 'single';
      setViewMode('single');
      appState.activeScreen = appState.userRole === 'adm' ? 'relatorios' : 'ranking';
      renderApp();
      showToast(
        appState.userRole === 'adm'
          ? 'Sessão ADM iniciada.'
          : 'Sessão operador iniciada.'

    function calcularPontuacao(volumeM3, pesoKg) {
      const vol = Number(volumeM3) || 0;
      const peso = Number(pesoKg) || 0;
      return Math.max(10, Math.round(vol * 12 + peso * 0.025));
    }

    function getPeriodStart() {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      if (appState.rankingPeriod === 'semana') {
        start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      } else if (appState.rankingPeriod === 'mes') {
        start.setDate(1);
      }
      return start.getTime();
    }

    function getEmployeePeriodStats(employee) {
      if (IS_ANDROID_APP) {
        const start = getPeriodStart();
        const approvedNotes = appState.notes.filter((note) =>
          note.employeeId === String(employee.id) &&
          note.status === 'APROVADO' &&
          Number(note.createdAt) >= start
        );
        return {
          points: approvedNotes.reduce((total, note) => total + (Number(note.points) || 0), 0) +
            (Number(employee.pontosAjusteAdm) || 0),
          volumeM3: approvedNotes.reduce((total, note) => total + (Number(note.volumeM3) || 0), 0),
          notes: approvedNotes.length
        };
      }
      const factor = appState.rankingPeriod === 'hoje' ? 0.22 :
        appState.rankingPeriod === 'mes' ? 3.85 : 1;
      return {
        points: Math.round((Number(employee.pontosSemana) || 0) * factor),
        volumeM3: Number(employee.volumeM3) || 0,
        notes: Number(employee.notas) || 0
      };
    }

    function getSortedEmployees() {
      return appState.employees.filter((employee) => employee.ativo !== false).sort(
        (a, b) => getEmployeePeriodStats(b).points - getEmployeePeriodStats(a).points
      );
    }

    function getInitials(nome) {
      const parts = String(nome || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return 'CC';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      const text = document.getElementById('toastText');
      if (!banner || !text) return;

      banner.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2800);
    }

    function handleLogin() {
      loginError = '';
      if (!appState.loginId.trim() || !appState.loginPin) {
        loginError = 'Informe sua matrícula e senha.';
        renderApp();
        return;
      }
      if (appState.loginPin.length > 15) {
        loginError = 'A senha pode ter no máximo 15 caracteres.';
        renderApp();
        return;
      }
      if (IS_ANDROID_APP && window.AndroidApp) {
        appState.loginPending = true;
        renderApp();
        window.AndroidApp.login(appState.loginId.trim(), appState.loginPin);
        return;
      } else {
        try {
          window.localStorage.setItem('santriRankRememberedLogin', appState.loginId.trim());
        } catch (error) {
          console.warn('Não foi possível salvar a matrícula neste navegador.', error);
        }
      }

      appState.loginPin = '';
      appState.viewMode = 'single';
      setViewMode('single');
      appState.activeScreen = appState.userRole === 'adm' ? 'relatorios' : 'ranking';
      renderApp();
      showToast(
        appState.userRole === 'adm'
          ? 'Sessão ADM iniciada.'
          : 'Sessão de Operador iniciada.'
      );
    }

    // =========================================================================
    // Scanner de notas
    // =========================================================================

    function clearScanAnalysisPreview() {
      if (window.AndroidApp) {
        if (appState.scanAnalysisRequestId) {
          window.AndroidApp.cancelScanAnalysis(appState.scanAnalysisRequestId);
        }
        if (appState.scanAnalysis?.token) {
          window.AndroidApp.cancelScanAnalysis(appState.scanAnalysis.token);
        }
      }
      appState.scanAnalysis = null;
      appState.scanAnalysisLoading = false;
      appState.scanAnalysisError = '';
      appState.scanAnalysisRequestId = '';
    }

    function renderScanAnalysisPreview() {
      const analysis = appState.scanAnalysis;
      if (!analysis) return '';
      const adjustment = Math.round((Number(analysis.itemWeightFactor || 1) - 1) * 100);
      const adjustmentLabel = adjustment > 0 ? `+${adjustment}%` : `${adjustment}%`;
      const items = Array.isArray(analysis.items) ? analysis.items : [];
      return `
        <section class="rounded-2xl border border-campeao-green/25 bg-campeao-greenSoft/50 p-3.5 space-y-3">
          <div>
            <p class="text-xs font-bold text-campeao-ink">Prévia calculada pela IA</p>
            <p class="text-[10px] text-campeao-muted mt-0.5">
              Nota ${escapeHtml(analysis.number || 'sem número identificado')} · confiança média
              ${Math.round((Number(analysis.confidence) || 0) * 100)}%
            </p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="rounded-xl bg-white border border-campeao-line p-2.5">
              <p class="text-[10px] text-campeao-muted">Pontuação base</p>

            </div>
            <div class="rounded-xl bg-white border border-campeao-green/25 p-2.5">
              <p class="text-[10px] text-campeao-greenDark">Sugestão IA</p>
              <p class="text-lg font-bold text-campeao-greenDark">${Number(analysis.suggestedPoints || 0).toLocaleString('pt-BR')} pts</p>
            </div>
          </div>
          <div class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2.5">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-[10px] font-bold text-amber-900">Erros encontrados pela IA</p>
                <p class="text-[9px] text-amber-800">Cada erro reduz pontos conforme a tabela vigente.</p>
              </div>
              <span class="min-w-10 rounded-lg bg-white px-2.5 py-1.5 text-center text-sm font-bold text-amber-900 border border-amber-200">
                ${Number(analysis.errorCount || 0)}
              </span>
            </div>
          </div>
          <p class="text-[10px] text-campeao-muted">
            Ajuste de ${adjustmentLabel} nos pontos por item/SKU
            (${Number(analysis.baseItemPoints || 0).toLocaleString('pt-BR')} → ${Number(analysis.suggestedItemPoints || 0).toLocaleString('pt-BR')} pts).
            Demais critérios seguem a tabela vigente. A nota só entra no ranking após aprovação do ADM.
          </p>
          ${items.length ? `
            <div class="space-y-1.5">
              <p class="text-[10px] font-semibold text-campeao-ink">Itens reconhecidos</p>
              ${items.map((item) => `
                <div class="rounded-xl bg-white/80 px-2.5 py-2">
                  <div class="flex justify-between gap-2">
                    <span class="text-[10px] font-semibold text-campeao-ink">${escapeHtml(item.description || 'Item sem descrição')}</span>
                    <span class="text-[10px] text-campeao-muted shrink-0">${Number(item.quantity || 0).toLocaleString('pt-BR')} ${escapeHtml(item.unit || '')}</span>
                  </div>
                  <p class="text-[10px] text-campeao-muted">
                    ${escapeHtml(item.category || 'Categoria não definida')} · complexidade ${Number(item.complexity || 3)}/5 · confiança ${Math.round((Number(item.confidence) || 0) * 100)}%
                  </p>
                  ${item.reason ? `<p class="text-[10px] text-campeao-muted">${escapeHtml(item.reason)}</p>` : ''}
                </div>
              `).join('')}
            </div>
          ` : '<p class="text-[10px] text-campeao-muted">Nenhum item classificável; foi mantido o peso neutro.</p>'}
          <button type="button" onclick="confirmScanAnalysis()"
            class="btn-primary w-full py-2.5 rounded-xl text-xs font-semibold cursor-pointer"
            ${appState.scanConfirmRequestId ? 'disabled' : ''}>
            ${appState.scanConfirmRequestId ? 'Enviando para aprovação…' : 'Confirmar prévia e enviar ao ADM'}
          </button>
        </section>
      `;
    }

    function renderAiAuditSummary(note) {
      if (!note.aiAnalysis) return '';
      try {
        const analysis = JSON.parse(note.aiAnalysis);
        const items = Array.isArray(analysis.items) ? analysis.items : [];
        if (!items.length) return '';
        const factor = Number(analysis.itemWeightFactor) || 1;
        const adjustment = Math.round((factor - 1) * 100);
        const label = adjustment > 0 ? `+${adjustment}%` : `${adjustment}%`;
        return `
          <div class="rounded-lg bg-campeao-surface/80 p-2">
            <p class="text-[10px] font-semibold text-campeao-ink">Análise IA · ajuste SKU ${label}</p>
            <p class="text-[10px] text-campeao-muted">
              ${items.slice(0, 5).map((item) =>
                `${escapeHtml(item.description || 'Item')} (${Number(item.complexity || 3)}/5)`
              ).join(' · ')}
              ${items.length > 5 ? ` · +${items.length - 5} itens` : ''}
            </p>
          </div>
        `;
      } catch (error) {
        console.warn('Não foi possível exibir a análise IA da nota.', error);
        return '<p class="text-[10px] text-amber-800">Análise da IA indisponível para esta nota.</p>';
      }
    }

    function renderScannerScreen() {
      const hasPhoto = Boolean(appState.scanPhotoName);
      const scanLocked = Boolean(appState.scanConfirmRequestId);
      const scanEmployees = appState.userRole === 'operador'
        ? appState.employees.filter((employee) =>
            String(employee.matricula || '').toLowerCase() === String(appState.loginId || '').toLowerCase()
          )
        : appState.employees.filter((employee) => employee.ativo !== false);

      return `
        <div class="space-y-4">
          <div class="pt-1">
            <h1 class="text-lg font-bold tracking-tight text-campeao-ink">Scanner</h1>
            <p class="text-[11px] text-campeao-muted">Envie a foto da nota e adicione uma observação</p>
          </div>

          <!-- Prévia da imagem da nota -->
          <div class="hairline-card rounded-3xl p-4 space-y-3">
            ${hasPhoto ? `
              <div class="rounded-2xl bg-campeao-greenSoft/70 border border-campeao-green/25 p-4 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-xl bg-white border border-campeao-green/20 flex items-center justify-center text-campeao-greenDark shrink-0">
                    ${appState.scanPhotoSource === 'camera' ? ICONS.camera : ICONS.paperclip}
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-semibold text-campeao-ink truncate">${escapeHtml(appState.scanPhotoName)}</p>
                    <p class="text-[10px] text-campeao-greenDark font-medium">
                      ${appState.scanPhotoSource === 'camera' ? 'Capturada pela câmera' : 'Imagem anexada'}
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  onclick="clearScanPhoto()"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-medium text-campeao-muted hover:text-campeao-ink bg-white border border-campeao-line cursor-pointer"
                  ${scanLocked ? 'disabled' : ''}
                >
                  Trocar
                </button>
              </div>
            ` : `
              <div class="rounded-2xl border border-dashed border-campeao-line bg-campeao-surface/70 py-7 px-4 text-center space-y-1.5">
                <div class="mx-auto w-10 h-10 rounded-2xl bg-white border border-campeao-line flex items-center justify-center text-campeao-greenDark">
                  ${ICONS.camera}
                </div>
                <p class="text-xs font-semibold text-campeao-ink">Nenhuma foto selecionada</p>
                <p class="text-[11px] text-campeao-muted">Tire uma foto da nota ou anexe da galeria</p>
              </div>
            `}

            <!-- Ações para capturar ou anexar uma imagem -->
            <div class="grid grid-cols-2 gap-2.5">
              <button
                type="button"
                onclick="triggerScanCapture()"
                class="btn-primary py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer"
                ${scanLocked ? 'disabled' : ''}
              >
                ${ICONS.camera}
                <span>Tirar Foto</span>
              </button>

              <button
                type="button"
                onclick="triggerScanAttach()"
                class="btn-ghost py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer"
                ${scanLocked ? 'disabled' : ''}
              >
                ${ICONS.paperclip}
                <span>Anexar Foto</span>
              </button>
              <input
                id="scanPhotoInput"
                type="file"
                accept="image/*"
                class="hidden"
                ${scanLocked ? 'disabled' : ''}
                onchange="handleAttachPhoto(event)"
              />
            </div>
          </div>

          <!-- Observação da nota -->
          <div class="hairline-card rounded-3xl p-4 space-y-3">
            ${appState.userRole === 'adm' ? `
              <div>
                <label for="scanEmployee" class="block text-xs font-semibold text-campeao-ink mb-1">Colaborador</label>
                <select
                  id="scanEmployee"
                  onchange="clearScanAnalysisPreview(); appState.scanEmployeeId = this.value; saveAppState(); renderApp()"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-campeao-line bg-campeao-surface/50 text-xs text-campeao-ink"
                  ${scanLocked ? 'disabled' : ''}
                >
                  <option value="">Selecione o colaborador</option>
                  ${scanEmployees.map((employee) => `
                    <option value="${escapeHtml(employee.id)}" ${appState.scanEmployeeId === employee.id ? 'selected' : ''}>
                      ${escapeHtml(employee.nome)}
                    </option>
                  `).join('')}
                </select>
              </div>
            ` : `
              <div class="rounded-xl border border-campeao-green/20 bg-campeao-greenSoft/60 px-3.5 py-3">
                <p class="text-[9px] font-bold uppercase tracking-wide text-campeao-greenDark">Colaborador vinculado</p>
                <p class="mt-1 text-xs font-semibold text-campeao-ink">
                  ${escapeHtml(scanEmployees[0]?.nome || 'Conta não vinculada')}
                </p>
                ${!scanEmployees.length
                  ? '<p class="mt-1 text-[10px] text-red-700">Fale com o administrador para vincular sua conta.</p>'
                  : ''}
              </div>
            `}
            <div>
              <label class="block text-xs font-semibold text-campeao-ink mb-1">Observação</label>
              <textarea
                rows="3"
                placeholder="Ex.: Carga conferida no pátio SIA, cliente aguardando..."
                oninput="clearScanAnalysisPreview(); appState.scanObservation = this.value"
                class="w-full px-3.5 py-2.5 rounded-2xl border border-campeao-line bg-campeao-surface/50 text-xs text-campeao-ink placeholder:text-campeao-subtle focus:outline-none focus:bg-white focus:border-campeao-green transition resize-none"
                ${scanLocked ? 'disabled' : ''}
              >${escapeHtml(appState.scanObservation)}</textarea>
            </div>

            <button
              type="button"
              onclick="submitSimpleScan()"
              class="btn-primary w-full py-2.5 rounded-xl text-xs font-semibold cursor-pointer"
              ${appState.scanAnalysisLoading || appState.scanConfirmRequestId ? 'disabled' : ''}
            >
              ${appState.scanAnalysisLoading ? 'Analisando nota com IA…' : IS_ANDROID_APP ? 'Analisar e calcular prévia' : 'Enviar Nota'}
            </button>
            ${appState.scanAnalysisLoading ? `
              <p class="text-[10px] text-campeao-muted text-center">A IA está lendo os itens. Isso pode levar alguns segundos.</p>
            ` : ''}
            ${appState.scanAnalysisError ? `
              <div class="rounded-xl border border-amber-200 bg-amber-50 p-3 space-y-2">
                <p class="text-[10px] text-amber-900">${escapeHtml(appState.scanAnalysisError)}</p>
                <button type="button" onclick="submitManualScan()"
                  class="btn-ghost w-full py-2 rounded-lg text-[10px] font-semibold cursor-pointer">
                  Enviar sem análise da IA (0 pontos, revisão do ADM)
                </button>
              </div>
            ` : ''}
            ${renderScanAnalysisPreview()}
          </div>
        </div>
      `;
    }

    let pendingPhotoSource = 'camera';

    function triggerScanCapture() {
      pendingPhotoSource = 'camera';
      const input = document.getElementById('scanPhotoInput');
      if (!input) return;
      input.value = '';
      input.setAttribute('capture', 'environment');
      input.click();
    }

    function triggerScanAttach() {
      pendingPhotoSource = 'anexo';
      const input = document.getElementById('scanPhotoInput');
      if (!input) return;
      input.value = '';
      input.removeAttribute('capture');
      input.click();
    }

    function handleAttachPhoto(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      clearScanAnalysisPreview();
      selectedPhotoFile = file;
      appState.scanPhotoSource = pendingPhotoSource;
      appState.scanPhotoName = file.name;
      renderApp();
      showToast(pendingPhotoSource === 'camera' ? 'Foto capturada.' : 'Foto anexada.');
    }

    function clearScanPhoto() {
      clearScanAnalysisPreview();
      selectedPhotoFile = null;
      appState.scanPhotoSource = '';
      appState.scanPhotoName = '';
      renderApp();
    }

    function submitSimpleScan() {
      if (!appState.scanPhotoName) {
        showToast('Tire ou anexe uma foto antes de enviar.');
        return;
      }

      if (IS_ANDROID_APP && window.AndroidApp) {
        if (!appState.scanEmployeeId) {
          showToast('Selecione o colaborador da nota.');
          return;
        }
        if (!selectedPhotoFile) {
          showToast('Selecione ou tire a foto novamente.');
          return;
        }
        clearScanAnalysisPreview();
        const requestId = `analysis-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        appState.scanAnalysisLoading = true;
        appState.scanAnalysisRequestId = requestId;
        renderApp();
        const reader = new FileReader();
        reader.onload = () => {
          try {
            if (appState.scanAnalysisRequestId !== requestId) return;
            window.AndroidApp.analyzeScan(
              appState.scanEmployeeId,
              appState.scanPhotoName,
              appState.scanPhotoSource,
              appState.scanObservation,
              String(reader.result || ''),
              requestId
            );
          } catch (error) {
            console.error('Falha ao analisar a nota.', error);
            appState.scanAnalysisLoading = false;
            appState.scanAnalysisRequestId = '';
            appState.scanAnalysisError = 'Não foi possível iniciar a análise. Tente novamente.';
            renderApp();
          }
        };
        reader.onerror = () => {
          appState.scanAnalysisLoading = false;
          appState.scanAnalysisRequestId = '';
          appState.scanAnalysisError = 'Não foi possível ler a foto selecionada.';
          renderApp();
        };
        reader.readAsDataURL(selectedPhotoFile);
        return;
      }

      const leader = getSortedEmployees()[0] || appState.employees[0];
      const earnedPts = 145;
      leader.pontosSemana += earnedPts;
      leader.notas += 1;

      appState.notes.unshift({
        id: 'note-' + Date.now(),
        autor: leader.nome,
        titulo: `${appState.scanPhotoName} (+${earnedPts} pts)`,
        detalhe: appState.scanObservation.trim() || 'Nota enviada sem observação adicional.',
        tempo: 'Agora'
      });

      appState.scanPhotoSource = '';
      appState.scanPhotoName = '';
      appState.scanObservation = '';
      selectedPhotoFile = null;
      appState.activeScreen = 'ranking';
      renderApp();
      showToast(`Nota enviada (+${earnedPts} pts computados).`);
    }

    function confirmScanAnalysis() {
      if (!appState.scanAnalysis?.token || !window.AndroidApp) {
        showToast('A prévia expirou. Analise a imagem novamente.');
        return;
      }
      if (appState.scanConfirmRequestId) return;
      const requestId = `confirm-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      appState.scanConfirmRequestId = requestId;
      renderApp();
      try {
        window.AndroidApp.confirmAnalyzedScan(appState.scanAnalysis.token, requestId);
      } catch (error) {
        console.error('Falha ao confirmar a nota analisada.', error);
        appState.scanConfirmRequestId = '';
        showToast('Não foi possível enviar a nota. Tente novamente.');
        renderApp();
      }
    }

    function submitManualScan() {
      if (!IS_ANDROID_APP || !window.AndroidApp || !selectedPhotoFile || !appState.scanEmployeeId) {
        showToast('Selecione um colaborador e uma imagem válida.');
        return;
      }
      if (appState.scanAnalysisLoading || appState.scanConfirmRequestId) return;
      const reader = new FileReader();
      reader.onload = () => {
        const cb = 'onSubmitScanResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível registrar a nota.');
              return;
            }
            clearScanAnalysisPreview();
            appState.scanPhotoSource = '';
            appState.scanPhotoName = '';
            appState.scanObservation = '';
            selectedPhotoFile = null;
            applyNativeBootstrap();
            appState.activeScreen = 'equipe';
            appState.equipeTab = 'notas';
            appState.noteStatusFilter = 'queue';
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao registrar nota manual.', error);
            showToast('Não foi possível registrar a nota.');
          }
        };
        window.AndroidApp.submitScan(
          appState.scanEmployeeId,
          appState.scanPhotoName,
          appState.scanObservation,
          String(reader.result || ''),
          cb
        );
      };
      reader.onerror = () => showToast('Não foi possível ler a foto selecionada.');
      reader.readAsDataURL(selectedPhotoFile);
    }

    function selectOcrPreset(i) {
      appState.ocrPresetIdx = i;
      appState.ocrVolume = OCR_PRESETS[i].volumeM3;
      appState.ocrPeso = OCR_PRESETS[i].pesoKg;
      renderApp();
    }

    function confirmOcrPoints() {
      const pts = calcularPontuacao(appState.ocrVolume, appState.ocrPeso);
      const emp = appState.employees.find((e) => e.id === appState.ocrEmployeeId) || appState.employees[0];
      const preset = OCR_PRESETS[appState.ocrPresetIdx];

      emp.pontosSemana += pts;
      emp.volumeM3 = Number((emp.volumeM3 + Number(appState.ocrVolume || 0)).toFixed(1));
      emp.pesoKg += Number(appState.ocrPeso || 0);
      emp.notas += 1;

      appState.notes.unshift({
        id: 'note-' + Date.now(),
        autor: emp.nome,
        titulo: `${preset.code} registrada (+${pts} pts)`,
        detalhe: `${appState.ocrVolume} m³ • ${Number(appState.ocrPeso).toLocaleString('pt-BR')} kg`,
        tempo: 'Agora'
      });

      appState.activeScreen = 'ranking';
      renderApp();
      showToast(`+${pts} pts adicionados para ${emp.nome}.`);
    }

    // =========================================================================
    // Equipe e notas
    // =========================================================================

    function getEquipeNoteStatus(note) {
      return note.status || (note.noteId ? 'PENDENTE' : 'REGISTRO');
    }

    function isNoteAwaitingReview(note) {
      const status = getEquipeNoteStatus(note);
      return status === 'PENDENTE' || status === 'REVISAR';
    }

    function renderEquipeScreen() {
      const isEquipe = appState.equipeTab === 'equipe';
      const isAdmin = appState.userRole === 'adm';
      const noteForm = appState.noteForm;
      const allNotes = appState.notes;
      const pendingCount = allNotes.filter((note) => getEquipeNoteStatus(note) === 'PENDENTE').length;
      const reviewCount = allNotes.filter((note) => getEquipeNoteStatus(note) === 'REVISAR').length;
      const approvedCount = allNotes.filter((note) => getEquipeNoteStatus(note) === 'APROVADO').length;
      const reviewQueueCount = pendingCount + reviewCount;
      const noteFilter = isAdmin ? appState.noteStatusFilter : 'all';
      const employees = appState.employees.filter((employee) => {
        const matchesQuery = `${employee.nome} ${employee.matricula} ${employee.cargo} ${employee.setor}`
          .toLowerCase()
          .includes(appState.employeeSearch.toLowerCase());
        return matchesQuery && (isAdmin || employee.ativo !== false);
      });
      const notes = allNotes.filter((note) => {
        const status = getEquipeNoteStatus(note);
        if (noteFilter === 'queue') return isNoteAwaitingReview(note);
        return noteFilter === 'all' || status === noteFilter;
      });
      const activeEmployees = appState.employees.filter((employee) => employee.ativo !== false).length;
      const inactiveEmployees = appState.employees.length - activeEmployees;

      return `
        <div class="space-y-4 pb-3">
          <header class="hairline-card rounded-2xl p-4 space-y-4">
            <div class="flex items-start justify-between gap-3">
              <div>
                <span class="text-[9px] font-bold uppercase tracking-[0.14em] text-campeao-greenDark">Gestão da unidade</span>
                <h1 class="mt-1 text-lg font-bold tracking-tight text-campeao-ink">Equipe &amp; Notas</h1>
                <p class="mt-1 text-[11px] text-campeao-muted">Brasília-DF · consulta da equipe e conferência de notas.</p>
              </div>
              <span class="shrink-0 rounded-full bg-campeao-greenSoft px-2.5 py-1 text-[10px] font-bold text-campeao-greenDark">
                ${appState.employees.length} pessoas
              </span>
            </div>
            <div role="tablist" aria-label="Seções da equipe" class="grid grid-cols-2 gap-1 rounded-xl bg-campeao-surface p-1">
              <button
                type="button" role="tab" aria-selected="${isEquipe}"
                onclick="appState.equipeTab = 'equipe'; renderApp();"
                class="rounded-lg px-3 py-2 text-xs font-semibold transition cursor-pointer ${
                  isEquipe ? 'bg-campeao-greenDark text-white' : 'text-campeao-muted'
                }"
              >
                Equipe
              </button>
              <button
                type="button" role="tab" aria-selected="${!isEquipe}"
                onclick="appState.equipeTab = 'notas'; appState.noteStatusFilter = appState.userRole === 'adm' ? 'queue' : 'all'; renderApp();"
                class="rounded-lg px-3 py-2 text-xs font-semibold transition cursor-pointer ${
                  !isEquipe ? 'bg-campeao-greenDark text-white' : 'text-campeao-muted'
                }"
              >
                Notas
              </button>
            </div>
          </header>

          ${isEquipe ? `
            <section class="grid grid-cols-3 gap-2" aria-label="Resumo da equipe">
              <div class="hairline-card rounded-xl p-3">
                <p class="text-[9px] font-semibold uppercase tracking-wide text-campeao-muted">Ativos</p>
                <p class="mt-1 text-lg font-bold text-campeao-greenDark">${activeEmployees}</p>
              </div>
              <div class="hairline-card rounded-xl p-3">
                <p class="text-[9px] font-semibold uppercase tracking-wide text-campeao-muted">Inativos</p>
                <p class="mt-1 text-lg font-bold text-campeao-ink">${inactiveEmployees}</p>
              </div>
              <div class="hairline-card rounded-xl p-3">
                <p class="text-[9px] font-semibold uppercase tracking-wide text-campeao-muted">Total</p>
                <p class="mt-1 text-lg font-bold text-campeao-ink">${appState.employees.length}</p>
              </div>
            </section>
            <label class="block text-xs font-semibold text-campeao-ink">Buscar funcionário
              <input id="employeeSearch" value="${escapeHtml(appState.employeeSearch)}" oninput="updateEmployeeSearch(this.value)"
                placeholder="Nome, matrícula, cargo ou setor"
                class="mt-1 w-full rounded-xl border border-campeao-line bg-white px-3.5 py-3 text-sm" />
            </label>
            <div class="space-y-2.5">
              ${employees.length ? employees.map((emp) => `
                <article class="hairline-card rounded-2xl p-3.5 space-y-3">
                  <div class="flex items-center gap-3">
                    <button type="button" onclick="openProfileModal('${emp.id}')"
                      aria-label="Abrir perfil de ${escapeHtml(emp.nome)}"
                      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-campeao-green/20 bg-campeao-greenSoft text-xs font-bold text-campeao-greenDark">
                      ${getInitials(emp.nome)}
                    </button>
                    <button type="button" onclick="openProfileModal('${emp.id}')" class="min-w-0 flex-1 text-left">
                      <p class="truncate text-sm font-bold text-campeao-ink">${escapeHtml(emp.nome)}</p>
                      <p class="mt-0.5 truncate text-[10px] text-campeao-muted">${escapeHtml(emp.matricula || 'Sem matrícula')} · ${escapeHtml(emp.cargo)}</p>
                      <p class="mt-0.5 truncate text-[10px] text-campeao-muted">${escapeHtml(emp.setor)}</p>
                    </button>
                    <span class="shrink-0 rounded-full px-2 py-1 text-[9px] font-bold ${
                      emp.ativo === false ? 'bg-red-50 text-red-700' : 'bg-campeao-greenSoft text-campeao-greenDark'
                    }">
                      ${emp.ativo === false ? 'Inativo' : 'Ativo'}
                    </span>
                  </div>
                </article>
              `).join('') : `
                <div class="hairline-card rounded-2xl p-6 text-center">
                  <p class="text-sm font-semibold text-campeao-ink">Nenhum funcionário encontrado</p>
                  <p class="mt-1 text-xs text-campeao-muted">Tente outra busca ou cadastre um novo funcionário.</p>
                </div>
              `}
            </div>
          ` : `
            ${isAdmin ? `
              <section id="teamNoteAuditQueue" aria-label="Fila de revisão de notas" class="hairline-card rounded-2xl p-3.5 space-y-3 scroll-mt-4">
                <header class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <span class="text-[9px] font-bold uppercase tracking-[0.12em] text-campeao-greenDark">Conferência ADM</span>
                    <h2 class="mt-1 text-sm font-bold text-campeao-ink">Revisão de notas</h2>
                    <p class="mt-0.5 text-[10px] text-campeao-muted">Confira o anexo e os dados. Os pontos só entram no ranking após a aprovação.</p>
                  </div>

    function startEmployeeEdit(employeeId = '') {
      const employee = appState.employees.find((item) => item.id === employeeId);

        id: employee.id,
        code: employee.matricula,
        name: employee.nome,
        job: employee.cargo,
        sector: employee.setor,
        situation: employee.situacao || (employee.ativo === false ? 'AFASTADO' : 'ATIVO'),
        password: ''
      } : {
        id: '',
        code: '',
        name: '',
        job: '',
        sector: '',
        situation: 'ATIVO',
        password: ''
      };
      renderApp();
    }

    function cancelEmployeeEdit() {
      appState.employeeForm = null;
      renderApp();
    }

    function updateEmployeeSearch(value) {
      const input = document.getElementById('employeeSearch');
      const cursor = input?.selectionStart ?? value.length;
      appState.employeeSearch = value;
      renderApp();
      const refreshedInput = document.getElementById('employeeSearch');
      refreshedInput?.focus();
      refreshedInput?.setSelectionRange(cursor, cursor);
    }

    function saveEmployeeFromForm(event) {
      event.preventDefault();
      const form = appState.employeeForm;
      if (!form) return;
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onSaveEmployeeResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível salvar o cadastro.');
              return;
            }
            appState.employeeForm = null;
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao salvar funcionário.', error);
            showToast('Não foi possível salvar o cadastro do funcionário.');
          }
        };
        window.AndroidApp.saveEmployee(
          form.id,
          form.code,
          form.name,
          form.job,
          form.sector,
          form.situation,
          form.password,
          cb
        );
        return;
      }
      const employee = {
        ...form,
        id: form.id || `emp-${Date.now()}`,
        matricula: form.code,
        nome: form.name,
        cargo: form.job,
        setor: form.sector,
        ativo: form.situation !== 'AFASTADO',
        pontosSemana: 0,
        volumeM3: 0,
        notas: 0,
        tier: 'Bronze'
      };
      const index = appState.employees.findIndex((item) => item.id === form.id);
      if (index >= 0) appState.employees[index] = { ...appState.employees[index], ...employee };
      else appState.employees.push(employee);
      appState.employeeForm = null;
      renderApp();
      showToast('Cadastro salvo.');
    }

    function saveAdminUserFromForm(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('adminUsername');
      const passwordInput = document.getElementById('adminPassword');
      const username = String(usernameInput?.value || '').trim().toUpperCase();
      const password = String(passwordInput?.value || '');
      if (!/^[A-Z0-9][A-Z0-9._-]{2,31}$/.test(username)) {
        showToast('Use um usuário de 3 a 32 caracteres: letras, números, ponto, hífen ou sublinhado.');
        return;
      }
      if (password.length < 6 || password.length > 15) {
        showToast('A senha deve ter de 6 a 15 caracteres.');
        return;
      }
      if (appState.employees.some((employee) =>
        String(employee.matricula || '').toUpperCase() === username
      )) {
        showToast('Esse usuário já está vinculado a um funcionário.');
        return;
      }
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onCreateAdminUserResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível criar o acesso administrativo.');
              return;
            }
            passwordInput.value = '';
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao criar acesso administrativo.', error);
            showToast('Não foi possível criar o acesso administrativo.');
          }
        };
        window.AndroidApp.createAdminUser(username, password, cb);
        return;
      }
      const adminUsers = Array.isArray(appState.adminUsers) ? appState.adminUsers : [];
      if (adminUsers.some((user) => String(user.username).toUpperCase() === username)) {
        showToast('Esse usuário já está cadastrado.');
        return;
      }
      appState.adminUsers = [...adminUsers, { username, role: 'ADMIN' }];
      renderApp();
      showToast('Acesso administrativo criado.');
    }

    function setEmployeeActive(employeeId, active) {
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onSetEmployeeActiveResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível atualizar o funcionário.');
              return;
            }
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao atualizar situação do funcionário.', error);
            showToast('Não foi possível atualizar a situação do funcionário.');
          }
        };
        window.AndroidApp.setEmployeeActive(employeeId, active, cb);
        return;
      }
      const employee = appState.employees.find((item) => item.id === employeeId);
      if (employee) {
        employee.ativo = active;
        employee.situacao = active ? 'ATIVO' : 'AFASTADO';
        renderApp();

      const values = [
        Number(document.getElementById('noteItemCount').value),
        Number(document.getElementById('noteUnitCount').value),
        Number(document.getElementById('noteVolumeM3').value),
        Number(document.getElementById('noteAreaM2').value),
        Number(document.getElementById('noteLinearMeters').value),
        Number(document.getElementById('noteBagCount').value),
        Number(document.getElementById('noteExecutionMinutes').value),
        Number(document.getElementById('noteErrorCount').value)
      ];
      if (values.some((value) => !Number.isFinite(value) || value < 0)) {
        showToast('Informe valores numéricos válidos, iguais ou maiores que zero.');
        return;
      }
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onSaveManualNoteResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível salvar a nota.');
              return;

            appState.noteForm = null;
            appState.noteStatusFilter = 'queue';
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao salvar nota.', error);
            showToast('Não foi possível salvar a nota.');
          }
        };
        window.AndroidApp.saveManualNote(
          form.id,
          form.employeeId,
          form.number,
          values[0],
          values[1],

        showToast('Informe uma quantidade válida de erros.');
        return;
      }
      if (!IS_ANDROID_APP || !window.AndroidApp) {
        showToast('Esta ação requer o aplicativo Android.');
        return;
      }
      const cb = 'onApproveNoteWithErrorsResult';
      window[cb] = function (resultJson) {
        delete window[cb];
        try {
          const result = JSON.parse(resultJson);
          if (!result.success) {
            showToast(result.message || 'Não foi possível aprovar a nota.');
            return;
          }
          applyNativeBootstrap();
          renderApp();
          showToast(result.message);
        } catch (error) {
          console.error('Falha na aprovação da nota.', error);
          showToast('Não foi possível concluir a aprovação.');

      };
      window.AndroidApp.setNotaAuditStatusWithErrors(noteId, 'Aprovado', errorCount, cb);

    function addNote() {
      const el = document.getElementById('newNoteField');
      if (!el || !el.value.trim()) return;
      if (IS_ANDROID_APP && window.AndroidApp) {
        const employeeId = document.getElementById('observationEmployeeId')?.value;
        const employee = appState.employees.find((item) => item.id === employeeId);
        if (!employee) {
          showToast('Selecione o funcionário relacionado à observação.');
          return;
        }
        const cb = 'onAddObservationResult';
        window[cb] = function (resultJson) {
          delete window[cb];

    function getReportData() {
      const monthCount = 6;
      const start = new Date();
      start.setDate(1);
      start.setHours(0, 0, 0, 0);
      start.setMonth(start.getMonth() - monthCount + 1);
      const employees = appState.employees;
      const notes = appState.notes.filter((note) => {
        const time = Number(note.createdAt);
        return note.noteId &&
          Number.isFinite(time) &&
          time >= start.getTime();
      });
      return { employees, notes, start, monthCount };
    }

    function getMonthlyReportRows(notes, monthCount) {
      const start = new Date();
      start.setDate(1);
      start.setHours(0, 0, 0, 0);
      start.setMonth(start.getMonth() - monthCount + 1);
      const months = [];
      for (let index = 0; index < monthCount; index += 1) {
        const date = new Date(start);
        date.setMonth(start.getMonth() + index);
        months.push({
          date,
          label: date.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
          fullLabel: date.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).replace('.', ''),
          approvedPoints: 0,
          approvedNotes: 0,
          approvedVolume: 0,
          pendingNotes: 0
        });
      }
      notes.forEach((note) => {
        const date = new Date(Number(note.createdAt));
        const month = months.find((entry) =>
          entry.date.getMonth() === date.getMonth() &&
          entry.date.getFullYear() === date.getFullYear()
        );
        if (!month) return;
        if (note.status === 'APROVADO') {
          month.approvedPoints += Number(note.points) || 0;
          month.approvedNotes += 1;
          month.approvedVolume += Number(note.volumeM3) || 0;
        } else if (note.status === 'PENDENTE' || note.status === 'REVISAR') {
          month.pendingNotes += 1;
        }
      });
      return months;
    }

    function renderMonthlyPerformanceChart(rows) {
      const months = rows.map((row) => row.label);
      const scaleSeries = (key) => {

        return values.map((value) => max ? (value / max) * 12 : 0);
      };
      const seriesA = scaleSeries('approvedPoints');
      const seriesB = scaleSeries('approvedNotes');
      const seriesC = scaleSeries('approvedVolume');
      const selectedIndex = Math.max(0, Math.min(appState.selectedChartPoint.index, rows.length - 1));

      const formatted = (value, digits = 0) => Number(value || 0).toLocaleString('pt-BR', {
        maximumFractionDigits: digits

      return `

          <p class="text-[10px] text-center text-campeao-muted">
            ${escapeHtml(selectedRow.fullLabel)} · ${formatted(selectedRow.approvedPoints)} pts · ${formatted(selectedRow.approvedNotes)} notas · ${formatted(selectedRow.approvedVolume, 2)} m³
          </p>
          <div class="overflow-x-auto">
            <table class="w-full text-[10px]" style="min-width:560px">
              <thead class="text-campeao-muted">
                <tr>
                  <th scope="col" class="px-2 py-2 text-left font-semibold">Mês</th>
                  <th scope="col" class="px-2 py-2 font-semibold" style="text-align:right">Pontos aprovados</th>

                ${rows.map((row, index) => `
                  <tr class="${index === selectedIndex ? 'bg-campeao-greenSoft/70' : 'bg-white'}">
                    <th scope="row" class="px-2 py-2 text-left font-semibold text-campeao-ink">
                      <button type="button" onclick="selectChartPoint('B', ${index})" class="text-campeao-ink">${escapeHtml(row.fullLabel)}</button>
                    </th>
                    <td class="px-2 py-2 tabular-nums" style="text-align:right">${formatted(row.approvedPoints)}</td>
                    <td class="px-2 py-2 tabular-nums" style="text-align:right">${formatted(row.approvedNotes)}</td>
                    <td class="px-2 py-2 tabular-nums" style="text-align:right">${formatted(row.approvedVolume, 2)}</td>
                    <td class="px-2 py-2 tabular-nums" style="text-align:right">${formatted(row.pendingNotes)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }
