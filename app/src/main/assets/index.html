    function renderReferenceLineChartSvg(months, sA, sB, sC) {
      const W = 316;
      const H = 198;
      const padL = 26;
      const padR = 22;
      const padT = 16;
      const padB = 26;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const maxY = 12;

      const xFor = (i) => {
        if (months.length === 1) return padL + plotW / 2;
        return padL + 14 + (i * (plotW - 24)) / (months.length - 1);
      };
      const yFor = (v) => padT + plotH - (v / maxY) * plotH;

      const yTicks = [0, 2, 4, 6, 8, 10, 12];

      const peakBIdx = sB.indexOf(Math.max(...sB));
      const peakAIdx = sA.indexOf(Math.max(...sA));
      const peakCIdx = sC.indexOf(Math.max(...sC));

      const polyPoints = (arr) =>
        arr.map((v, i) => `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');

      return `
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linhas com comparação mensal de pontos, notas e volume aprovados" class="w-full h-auto select-none">
          <defs>
            <marker id="axisArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#1F2937" />
            </marker>
          </defs>

          ${yTicks.map((tick) => {
            const y = yFor(tick).toFixed(1);
            return `
              ${tick > 0 ? `<line x1="${padL}" y1="${y}" x2="${W - 10}" y2="${y}" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2.5" />` : ''}
              <text x="${padL - 5}" y="${Number(y) + 3}" text-anchor="end" font-size="8.5" fill="#4B5563" font-weight="500">${tick}</text>
            `;
          }).join('')}

          ${months.map((m, i) => {
            const x = xFor(i).toFixed(1);
            return `
              <line x1="${x}" y1="${padT - 4}" x2="${x}" y2="${padT + plotH}" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2.5" />
              <text x="${x}" y="${H - 8}" text-anchor="middle" font-size="8.5" fill="#374151" font-weight="500">${m}</text>
            `;
          }).join('')}

          <line x1="${padL}" y1="${padT + plotH}" x2="${padL}" y2="${padT - 8}" stroke="#1F2937" stroke-width="1.4" marker-end="url(#axisArrow)" />
          <line x1="${padL}" y1="${padT + plotH}" x2="${W - 8}" y2="${padT + plotH}" stroke="#1F2937" stroke-width="1.4" marker-end="url(#axisArrow)" />
          <text x="${W - 6}" y="${H - 8}" text-anchor="end" font-size="8" fill="#4B5563" font-weight="600">Mês</text>

          ${appState.visibleSeries.B ? `
            <line x1="${padL}" y1="${yFor(sB[peakBIdx]).toFixed(1)}" x2="${xFor(peakBIdx).toFixed(1)}" y2="${yFor(sB[peakBIdx]).toFixed(1)}" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="2,2.5" />
          ` : ''}
          ${appState.visibleSeries.A ? `
            <line x1="${padL}" y1="${yFor(sA[peakAIdx]).toFixed(1)}" x2="${xFor(peakAIdx).toFixed(1)}" y2="${yFor(sA[peakAIdx]).toFixed(1)}" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="2,2.5" />
          ` : ''}
          ${appState.visibleSeries.C ? `
            <line x1="${padL}" y1="${yFor(sC[peakCIdx]).toFixed(1)}" x2="${xFor(peakCIdx).toFixed(1)}" y2="${yFor(sC[peakCIdx]).toFixed(1)}" stroke="#EAB308" stroke-width="1.2" stroke-dasharray="2,2.5" />
          ` : ''}

          ${appState.visibleSeries.C ? `
            <polyline fill="none" stroke="#FACC15" stroke-width="2" points="${polyPoints(sC)}" />
            ${sC.map((v, i) => {
              const isSel = appState.selectedChartPoint.series === 'C' && appState.selectedChartPoint.index === i;
              return `
                <circle
                  cx="${xFor(i).toFixed(1)}"
                  cy="${yFor(v).toFixed(1)}"
                  r="${isSel ? 6 : 4.8}"
                  fill="#FACC15"
                  stroke="${isSel ? '#854D0E' : 'none'}"
                  stroke-width="${isSel ? 1.5 : 0}"
                  class="cursor-pointer"
                  onclick="selectChartPoint('C', ${i})"
                />
              `;
            }).join('')}
          ` : ''}

          ${appState.visibleSeries.A ? `
            <polyline fill="none" stroke="#60A5FA" stroke-width="2" points="${polyPoints(sA)}" />
            ${sA.map((v, i) => {
              const isSel = appState.selectedChartPoint.series === 'A' && appState.selectedChartPoint.index === i;
              return `
                <circle
                  cx="${xFor(i).toFixed(1)}"
                  cy="${yFor(v).toFixed(1)}"
                  r="${isSel ? 6 : 4.8}"
                  fill="#60A5FA"
                  stroke="${isSel ? '#1E40AF' : 'none'}"
                  stroke-width="${isSel ? 1.5 : 0}"
                  class="cursor-pointer"
                  onclick="selectChartPoint('A', ${i})"
                />
              `;
            }).join('')}
          ` : ''}

          ${appState.visibleSeries.B ? `
            <polyline fill="none" stroke="#DC2626" stroke-width="2" points="${polyPoints(sB)}" />
            ${sB.map((v, i) => {
              const isSel = appState.selectedChartPoint.series === 'B' && appState.selectedChartPoint.index === i;
              return `
                <circle
                  cx="${xFor(i).toFixed(1)}"
                  cy="${yFor(v).toFixed(1)}"
                  r="${isSel ? 5.6 : 4.5}"
                  fill="#FFFFFF"
                  stroke="#DC2626"
                  stroke-width="${isSel ? 2.6 : 2}"
                  class="cursor-pointer"
                  onclick="selectChartPoint('B', ${i})"
                />
              `;
            }).join('')}
          ` : ''}
        </svg>
      `;
    }

    function toggleAdmEmployeeDetails(employeeId) {
      appState.admEmployeeExpandedId =
        String(appState.admEmployeeExpandedId) === String(employeeId) ? '' : String(employeeId);
      appState.pointAdjustmentEmployeeId = '';
      renderApp();
    }

    function openNoteAuditQueue() {
      appState.equipeTab = 'notas';
      appState.noteStatusFilter = 'queue';
      selectScreen('equipe');
      requestAnimationFrame(() => {
        document.getElementById('teamNoteAuditQueue')?.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      });
    }

    function updateAdmReportSearch(value) {
      const input = document.getElementById('admReportSearch');
      const cursor = input?.selectionStart ?? value.length;
      appState.admReportSearch = value;
      renderApp();
      const refreshedInput = document.getElementById('admReportSearch');
      refreshedInput?.focus();
      refreshedInput?.setSelectionRange(cursor, cursor);
    }

    function toggleReportSeries(key) {
      const next = { ...appState.visibleSeries, [key]: !appState.visibleSeries[key] };
      if (!next.A && !next.B && !next.C) return;
      appState.visibleSeries = next;
      renderApp();
    }

    function selectChartPoint(series, index) {
      appState.selectedChartPoint = { series, index };
      renderApp();
    }

    function exportReport(format = 'PDF') {
      if (format === 'CSV') {
        const { employees, notes, start } = getReportData();
        const escapeCsv = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
        const approved = notes.filter((note) => note.status === 'APROVADO');
        const pending = notes.filter((note) => note.status === 'PENDENTE' || note.status === 'REVISAR');
        const approvedPoints = approved.reduce((total, note) => total + (Number(note.points) || 0), 0);
        const approvedVolume = approved.reduce((total, note) => total + (Number(note.volumeM3) || 0), 0);
        const employeeSummary = employees.map((employee) => {
          const employeeNotes = approved.filter((note) => note.employeeId === String(employee.id));
          const points = employeeNotes.reduce((total, note) => total + (Number(note.points) || 0), 0);
          const adjustment = Number(employee.pontosAjusteAdm) || 0;
          return [
            employee.matricula,
            employee.nome,
            employee.setor,
            employeeNotes.length,
            points,
            adjustment,
            points + adjustment,
            employeeNotes.reduce((total, note) => total + (Number(note.volumeM3) || 0), 0)
          ];
        }).sort((a, b) => b[6] - a[6]);
        const monthlySummary = getMonthlyReportRows(notes, 6);
        const rows = [
          ['Relatório gerencial SantriRank'],
          ['Período inicial', start.toLocaleDateString('pt-BR')],
          ['Período final', new Date().toLocaleDateString('pt-BR')],
          ['Janela', 'Últimos 6 meses'],
          ['Setor', 'Todos os setores'],
          ['Gerado em', new Date().toLocaleString('pt-BR')],
          [],
          ['Resumo'],
          ['Funcionários', employees.length],
          ['Notas aprovadas', approved.length],
          ['Notas pendentes / em revisão', pending.length],
          ['Pontos aprovados', approvedPoints],
          ['Volume aprovado (m³)', approvedVolume],
          [],
          ['Desempenho mensal'],
          ['Mês', 'Pontos aprovados', 'Notas aprovadas', 'Volume aprovado (m³)', 'Pendentes'],
          ...monthlySummary.map((month) => [
            month.fullLabel,
            month.approvedPoints,
            month.approvedNotes,
            month.approvedVolume,
            month.pendingNotes
          ]),
          [],
          ['Desempenho por funcionário'],
          ['Matrícula', 'Funcionário', 'Setor', 'Notas aprovadas', 'Pontos aprovados', 'Ajustes ADM', 'Total no ranking', 'Volume aprovado (m³)'],
          ...employeeSummary,
          [],
          ['Detalhamento das notas'],
          ['Número da nota', 'Data', 'Matrícula', 'Colaborador', 'Setor', 'Status', 'Pontos', 'Itens', 'Unidades', 'Volume m³', 'Área m²', 'Metros lineares', 'Sacos', 'Erros', 'Observação'],
          ...notes.map((note) => {
            const employee = appState.employees.find((item) => item.id === note.employeeId);
            return [
              note.titulo,
              new Date(Number(note.createdAt)).toLocaleDateString('pt-BR'),
              employee?.matricula || '',
              note.autor,
              employee?.setor || '',
              note.status,
              note.points,
              note.itemCount,
              note.unitCount,
              note.volumeM3,
              note.areaM2,
              note.linearMeters,
              note.bagCount,
              note.errorCount,
              note.observation
            ];
          })
        ];
        const csv = '\ufeff' + rows.map((row) => row.map(escapeCsv).join(';')).join('\r\n');
        if (IS_ANDROID_APP && window.AndroidApp) {
          const cb = 'onSaveCsvResult';
          window[cb] = function (resultJson) {
            delete window[cb];
            try {
              const result = JSON.parse(resultJson);
              if (!result.success) {
                showToast(result.message || 'Não foi possível exportar o CSV.');
                return;
              }
              appState.exportedFormat = format;
              appState.exportedAt = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
              renderApp();
              showToast(result.message);
            } catch (error) {
              console.error('Falha ao exportar CSV.', error);
              showToast('Não foi possível exportar o CSV.');
            }
          };
          window.AndroidApp.saveCsv(csv, cb);
          return;
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        link.download = 'relatorio_santrirank.csv';
        link.click();
        URL.revokeObjectURL(link.href);
      } else {
        appState.exportedFormat = format;
        appState.exportedAt = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        if (IS_ANDROID_APP && window.AndroidApp) {
          window.AndroidApp.printReport();
        } else {
          window.print();
        }
      }
      renderApp();
      showToast(`Relatório ADM (${format}) gerado com os dados do período.`);
    }

    function toggleAdmAudit(empId) {
      const current = appState.admAuditStatus[empId] || 'Aprovado';
      const next = current === 'Aprovado' ? 'Pendente' : 'Aprovado';
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onSetAuditStatusResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível atualizar a auditoria.');
              return;
            }
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao atualizar auditoria.', error);
            showToast('Não foi possível atualizar a auditoria.');
          }
        };
        window.AndroidApp.setAuditStatus(empId, next, cb);
        return;
      }
      appState.admAuditStatus[empId] = next;
      renderApp();
      showToast(`Status de auditoria atualizado para ${appState.admAuditStatus[empId]}.`);
    }

    function submitAdmPointAdjustment(event, empId) {
      event.preventDefault();
      const amount = Number(document.getElementById('admPointAmount')?.value);
      const reason = document.getElementById('admPointReason')?.value?.trim() || '';
      if (!Number.isFinite(amount) || amount === 0 || !reason) {
        showToast('Informe um ajuste diferente de zero e a justificativa.');
        return;
      }
      adjustAdmBonus(empId, amount, reason);
    }

    function adjustAdmBonus(empId, bonusPts, reason = 'Ajuste rápido pelo painel ADM') {
      const emp = appState.employees.find((e) => e.id === empId);
      if (!emp) return;
      if (IS_ANDROID_APP && window.AndroidApp) {
        const cb = 'onAdjustBonusResult';
        window[cb] = function (resultJson) {
          delete window[cb];
          try {
            const result = JSON.parse(resultJson);
            if (!result.success) {
              showToast(result.message || 'Não foi possível aplicar o bônus.');
              return;
            }
            appState.pointAdjustmentEmployeeId = '';
            applyNativeBootstrap();
            renderApp();
            showToast(result.message);
          } catch (error) {
            console.error('Falha ao aplicar bônus.', error);
            showToast('Não foi possível aplicar o bônus.');
          }
        };
        window.AndroidApp.adjustBonus(empId, bonusPts, reason, cb);
        return;
      }
      emp.pontosAjusteAdm = (Number(emp.pontosAjusteAdm) || 0) + bonusPts;
      appState.pointAdjustmentEmployeeId = '';
      renderApp();
      showToast(`Ajuste ADM de ${bonusPts > 0 ? '+' : ''}${bonusPts} pts aplicado a ${emp.nome}.`);
    }

    function setRankingPeriod(p) {
      appState.rankingPeriod = p;
      renderApp();
    }

    function logoutApp() {
      if (window.AndroidApp) window.AndroidApp.logout();
      appState.activeScreen = 'login';
      appState.loginPin = '';
      loginError = '';
      renderApp();
    }

    window.handleAndroidBack = function () {
      if (!IS_ANDROID_APP || appState.activeScreen === 'login') return false;
      logoutApp();
      return true;
    };

    // =========================================================================
    // MODAL DE DETALHES DO FUNCIONÁRIO
    // =========================================================================

    function openProfileModal(empId) {
      const sorted = getSortedEmployees();
      const index = sorted.findIndex((e) => e.id === empId);
      const emp = appState.employees.find((employee) => employee.id === empId);
      if (!emp) return;

      const pos = index >= 0 ? index + 1 : '—';
      const stats = getEmployeePeriodStats(emp);
      const pts = stats.points;

      document.getElementById('profileModalContent').innerHTML = `
        <div class="p-5 space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full bg-campeao-greenSoft border border-campeao-green/25 flex items-center justify-center text-sm font-bold text-campeao-greenDark">
                ${getInitials(emp.nome)}
              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <h3 class="text-base font-bold text-campeao-ink">${emp.nome}</h3>
                  ${pos === 1 ? '<span class="text-amber-500">👑</span>' : ''}
                </div>
                <p class="text-xs text-campeao-muted">${emp.cargo} • #${pos}</p>
              </div>
            </div>
            <button onclick="closeProfileModal()" class="w-7 h-7 rounded-lg text-campeao-muted hover:bg-campeao-surface flex items-center justify-center cursor-pointer">
              ✕
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="rounded-2xl bg-campeao-surface p-2.5">
              <p class="text-[10px] text-campeao-muted">Pontos</p>
              <p class="text-sm font-bold text-campeao-greenDark mt-0.5">${pts.toLocaleString('pt-BR')}</p>
            </div>
            <div class="rounded-2xl bg-campeao-surface p-2.5">
              <p class="text-[10px] text-campeao-muted">Volume</p>
              <p class="text-sm font-bold text-campeao-ink mt-0.5">${stats.volumeM3.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} m³</p>
            </div>
            <div class="rounded-2xl bg-campeao-surface p-2.5">
              <p class="text-[10px] text-campeao-muted">Notas</p>
              <p class="text-sm font-bold text-campeao-ink mt-0.5">${stats.notes}</p>
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-xs text-campeao-muted">
              <span>Nível ${emp.tier} • ${emp.setor}</span>
              <span class="font-semibold text-campeao-ink">${emp.metaPct}%</span>
            </div>
            <div class="thin-track">
              <div class="thin-fill bg-campeao-green" style="width: ${emp.metaPct}%"></div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profileModal').classList.add('hidden');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // =========================================================================
    // Prévia do aplicativo e renderização global
    // =========================================================================

    function renderScreenContent(screenKey) {
      switch (screenKey) {
        case 'login':
          return renderLoginScreen();
        case 'ranking':
          return renderRankingScreen();
        case 'scanner':
          return renderScannerScreen();
        case 'equipe':
          return renderEquipeScreen();
        case 'relatorios':
          return renderRelatoriosScreen();
        case 'configuracoes':
          return renderConfiguracoesScreen();
        default:
          return renderRankingScreen();
      }
    }

    function renderBottomNav(screenKey) {
      const isAdm = appState.userRole === 'adm';
      const items = [
        { key: 'ranking', label: 'Ranking', icon: ICONS.navRanking },
        { key: 'scanner', label: 'Scanner', icon: ICONS.navScanner },
        { key: 'equipe', label: 'Equipe', icon: ICONS.navEquipe },
        ...(isAdm ? [
          { key: 'relatorios', label: 'Relatórios', icon: ICONS.navRelatorios },
          { key: 'configuracoes', label: 'Config.', icon: ICONS.navSettings }
        ] : [])
      ];

      return `
        <div class="bg-white/95 backdrop-blur border-t border-campeao-line px-2 py-1.5 flex items-center justify-around">
          ${items.map((item) => {
            const active = screenKey === item.key;
            return `
              <button
                type="button"
                onclick="selectScreen('${item.key}')"
                class="flex flex-col items-center justify-center gap-0.5 px-3 py-1 rounded-2xl text-[10px] font-semibold transition cursor-pointer ${
                  active
                    ? 'bg-campeao-greenSoft text-campeao-greenDark'
                    : 'text-campeao-muted hover:text-campeao-ink'
                }"
              >
                <span class="${active ? 'text-campeao-greenDark' : 'text-campeao-muted'}">${item.icon}</span>
                <span>${item.label}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderPhoneFrame(screenKey) {
      if (IS_ANDROID_APP) {
        return `
          <div class="android-app-frame">
            <div class="phone-viewport">
              ${renderScreenContent(screenKey)}
            </div>
            ${screenKey !== 'login' ? renderBottomNav(screenKey) : ''}
          </div>
        `;
      }
      return `
        <div class="phone-shell w-[360px] max-w-full rounded-[44px] p-2.5">
          <div class="rounded-[34px] overflow-hidden bg-campeao-surface flex flex-col h-[700px] max-h-[82vh]">
            <div class="bg-white px-5 pt-2.5 pb-1.5 flex items-center justify-between text-[11px] font-semibold text-campeao-ink border-b border-campeao-line/60">
              <span>09:41</span>
              <span class="w-16 h-3.5 rounded-full bg-zinc-900"></span>
              <span class="text-[10px] text-campeao-muted">${appState.userRole === 'adm' ? 'ADM' : 'OP'}</span>
            </div>

            <div class="phone-viewport flex-1 overflow-y-auto px-3.5 py-2.5">
              ${renderScreenContent(screenKey)}
            </div>

            ${screenKey !== 'login' ? renderBottomNav(screenKey) : ''}
          </div>
        </div>
      `;
    }

    function renderTabs() {
      const isAdm = appState.userRole === 'adm';
      document.querySelectorAll('.screen-tab').forEach((btn) => {
        const key = btn.getAttribute('data-screen-tab');
        const active = appState.viewMode === 'single' && appState.activeScreen === key;
        const locked = ['relatorios', 'configuracoes'].includes(key) && !isAdm;
        btn.textContent = locked ? `${SCREEN_LABELS[key]} (ADM)` : SCREEN_LABELS[key];
        if (btn.closest('.md\\:hidden')) {
          btn.className = `screen-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium border transition cursor-pointer ${
            active
              ? 'bg-campeao-greenDark text-white border-campeao-greenDark'
              : locked
                ? 'bg-campeao-surface text-campeao-subtle border-campeao-line'
                : 'bg-white text-campeao-muted border-campeao-line'
          }`;
        } else {
          btn.className = `screen-tab px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer ${
            active
              ? 'bg-white text-campeao-ink shadow-2xs'
              : locked
                ? 'text-campeao-subtle hover:text-campeao-muted'
                : 'text-campeao-muted hover:text-campeao-ink'
          }`;
        }
      });
    }

    // ---------------------------------------------------------------------------
    // Renderiza a interface de acordo com o estado e a tela ativa.
    // ---------------------------------------------------------------------------
    function renderApp() {
      renderTabs();
      saveAppState();
      const container = document.getElementById('showcaseContainer');

      if (appState.viewMode === 'side') {
        container.innerHTML = `
          <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-8 place-items-center">
            <div class="flex flex-col items-center gap-2.5">
              <span class="text-xs font-medium text-campeao-muted">Ranking • Destaques & Perfis</span>
              ${renderPhoneFrame('ranking')}
            </div>
            <div class="flex flex-col items-center gap-2.5">
              <span class="text-xs font-medium text-campeao-muted">Relatórios • Exclusivo ADM</span>
              ${renderPhoneFrame('relatorios')}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = renderPhoneFrame(appState.activeScreen);
      }
    }

    renderApp();
    applyNativeBootstrap();
  </script>
</body>
</html>
