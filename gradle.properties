android.disallowKotlinSourceSets=false
googleServices.missing.passthrough=true
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Dfile.encoding=UTF-8 -Duser.country=BR -Duser.language=pt
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=true
ksp.useKSP2=false
android.dexingHeapSize=512m
android.nonTransitiveRClass=true
android.enableArtifactTransforms=false
android.overridePathCheck=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
